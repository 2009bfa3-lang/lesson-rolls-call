[browser]
gatherUsageStats = false

[server]
headless = true
address = "0.0.0.0"
port = 8765
fileWatcherType = "none"
enableCORS = false
enableXsrfProtection = false
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#1f6b4a"
backgroundColor = "#f4f1ea"
secondaryBackgroundColor = "#fffdf8"
textColor = "#1a2332"
font = "sans serif"
